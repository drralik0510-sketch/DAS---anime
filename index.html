<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAS — Data Anime Signature</title>
  <meta name="description" content="DAS — Data Anime Signature, database anime modern dengan pencarian anime, karakter, manga, light novel, game, musik, dan profil pengguna.">
  <style>
    :root{
      --blue:#72bfff; --blue2:#dff3ff; --blue3:#edf9ff; --ink:#18324a;
      --muted:#6d8295; --line:#dbeaf4; --white:#fff; --shadow:0 12px 35px rgba(48,122,174,.12);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0%,#f5fbff 100%)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .nav{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:900;min-width:190px}
    .brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #a9dcff}
    .brand span{font-size:17px}.brand small{display:block;color:#66aee0;font-size:11px;letter-spacing:.8px}
    .navlinks{display:flex;gap:5px;flex:1}.navlinks button{border:0;background:transparent;color:#4e6d84;padding:10px 12px;border-radius:12px}
    .navlinks button:hover,.navlinks .active{background:var(--blue3);color:#2387c9}
    .search{position:relative;min-width:300px}.search input{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px 15px 12px 40px;outline:none;background:#fff}
    .search input:focus{border-color:#9ad6ff;box-shadow:0 0 0 4px #e7f6ff}
    .search span{position:absolute;left:14px;top:11px;color:#7fa1b7}
    main{max-width:1200px;margin:auto;padding:28px 20px 60px}
    .hero{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;margin:10px 0 30px}
    .hero-card{background:linear-gradient(135deg,#eaf8ff,#fff);border:1px solid #d7effc;border-radius:28px;padding:34px;min-height:280px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .hero-card:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#bfe8ff55;right:-100px;top:-100px}
    .eyebrow{color:#3e9ed7;font-weight:800;font-size:13px;letter-spacing:1px}
    h1{font-size:42px;line-height:1.05;margin:10px 0}.hero p{max-width:650px;color:#61788b;line-height:1.7}
    .hero-actions{display:flex;gap:10px;margin-top:22px}.primary,.ghost{border-radius:13px;padding:11px 16px;border:1px solid var(--line)}
    .primary{background:#69baf1;color:#fff;border-color:#69baf1;font-weight:800}.ghost{background:#fff;color:#3d6882}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
    .stat b{font-size:25px;display:block;color:#2c92d0}.stat span{font-size:12px;color:var(--muted)}
    section{margin:30px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 24px rgba(45,122,165,.08);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
    .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#eaf7ff}.card-body{padding:12px}.title{font-weight:800;font-size:14px;line-height:1.35;min-height:38px}.jp{font-size:11px;color:#7d95a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:#628095}.score{color:#178bcf;font-weight:800}
    .release{display:flex;gap:15px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.release img{width:65px;height:90px;object-fit:cover;border-radius:11px}.release .date{color:#258ecb;font-weight:800;font-size:12px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
    .list{display:grid;gap:10px}.result{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:15px;cursor:pointer;background:#fff}.result img{width:54px;height:76px;object-fit:cover;border-radius:9px}.result .kind{font-size:11px;color:#2f96d0;font-weight:800}
    .detail{display:grid;grid-template-columns:240px 1fr;gap:24px}.detail-poster{width:240px;border-radius:20px;box-shadow:var(--shadow)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;background:var(--blue3);color:#318cc4;border-radius:9px;font-size:12px}
    .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.info{background:#f8fcff;border:1px solid var(--line);padding:12px;border-radius:13px}.info small{display:block;color:#7b92a3;font-size:11px}.info b{font-size:13px}
    .tabs{display:flex;gap:7px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:#5c7587}.tabs button.active{background:#e8f6ff;color:#258bc6;border-color:#bce3fa}
    .character-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.char{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.char img{width:100%;aspect-ratio:1/1.2;object-fit:cover}.char div{padding:8px;font-size:11px}.char b{display:block}.char span{color:#7c91a1}
    .profile{max-width:700px;margin:auto}.avatar{width:90px;height:90px;border-radius:50%;background:#dff3ff;display:grid;place-items:center;font-size:35px;border:3px solid #a8dcfb}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800;color:#527087}.form input,.form select{border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}
    .nature{position:fixed;right:20px;bottom:20px;z-index:40}.nature-btn{width:58px;height:58px;border-radius:50%;border:0;background:#72bfff;color:#fff;font-weight:900;box-shadow:0 10px 30px #55aee855}.nature-box{position:absolute;right:0;bottom:70px;width:330px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:15px;display:none}.nature-box.open{display:block}.nature-box textarea{width:100%;height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;resize:none}.chat{height:160px;overflow:auto;background:#f8fcff;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px}.msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:90%}.bot{background:#e8f6ff}.me{background:#fff;border:1px solid var(--line);margin-left:auto}
    .empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.loading{padding:25px;color:#6791a8}
    footer{border-top:1px solid var(--line);padding:25px;text-align:center;color:#7890a0;font-size:12px}
    @media(max-width:900px){.nav{flex-wrap:wrap}.navlinks{order:3;width:100%;overflow:auto}.search{flex:1;min-width:200px}.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:150px 1fr}.detail-poster{width:150px}.character-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:560px){main{padding:18px 13px 50px}.brand{min-width:auto}.brand div{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail-poster{width:180px}.info-grid{grid-template-columns:1fr 1fr}.character-grid{grid-template-columns:repeat(3,1fr)}.hero-card{padding:24px}.hero h1{font-size:33px}}
  </style>
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a class="brand" href="#" onclick="showHome();return false;"><img src="assets/das-logo.png" alt="DAS logo"><div>DAS<small>Data Anime Signature</small></div></a>
    <div class="navlinks">
      <button class="active" id="nav-home" onclick="showHome()">Beranda</button>
      <button onclick="showSeason()">Musim Ini</button>
      <button onclick="showPopular()">Populer</button>
      <button onclick="showSearch()">Database</button>
      <button onclick="showProfile()">Profil</button>
    </div>
    <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Cari anime, karakter, manga..." onkeydown="if(event.key==='Enter')doSearch(this.value)"></div>
  </nav>
</header>

<main id="app"></main>

<div class="nature">
  <div class="nature-box" id="natureBox">
    <strong>✦ NATURE</strong>
    <div class="chat" id="chat"><div class="msg bot">Halo! Aku Nature. Coba tanya “anime musim ini”, “cari One Piece”, atau “profil saya”.</div></div>
    <textarea id="natureInput" placeholder="Tanya Nature..."></textarea>
    <button class="primary" style="width:100%;margin-top:7px" onclick="askNature()">Tanya</button>
  </div>
  <button class="nature-btn" onclick="document.getElementById('natureBox').classList.toggle('open')">N</button>
</div>

<footer>DAS — Data Anime Signature · Data publik bersumber dari layanan database anime pihak ketiga. DAS bukan bagian dari MyAnimeList/AniList.</footer>

<script>
const API='https://graphql.anilist.co';
const app=document.getElementById('app');
const FALL=2026; // September 2026 = Fall 2026

async function gql(query,variables={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});
  if(!r.ok) throw new Error('API error '+r.status);
  const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message); return j.data;
}
const mediaFields=`id title{romaji english native userPreferred} coverImage{large extraLarge} bannerImage description(asHtml:false) averageScore popularity episodes status format season seasonYear startDate{year month day} endDate{year month day} duration genres tags{name} studios(isMain:true){nodes{name}} externalLinks{site url} relations{edges{relationType node{id type title{romaji native} coverImage{large}}}} characters(sort:ROLE,perPage:18){edges{role node{id name{full native} image{large} siteUrl} voiceActors(language:JA){id name{full native} image{large}}}} staff(sort:RELEVANCE,perPage:15){edges{role node{id name{full} image{large}}}}`;
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clean(s){return (s||'').replace(/<[^>]*>/g,'');}
function card(a){return `<article class="card" onclick="showDetail(${a.id})"><img class="poster" src="${a.coverImage?.large||''}" alt="${esc(a.title?.romaji)}"><div class="card-body"><div class="title">${esc(a.title?.romaji||a.title?.native)}</div><div class="jp">${esc(a.title?.native||'')}</div><div class="meta"><span class="score">★ ${a.averageScore? (a.averageScore/10).toFixed(1):'—'}</span><span>${a.format||''}</span><span>${a.episodes||'?'} eps</span></div></div></article>`}
function section(title,sub,content){return `<section><div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div></div>${content}</section>`}
async function showHome(){
  app.innerHTML=`<div class="hero"><div class="hero-card"><div class="eyebrow">DATA ANIME SIGNATURE · DAS</div><h1>Temukan dunia anime,<br><span style="color:#5aafe6">lebih lengkap.</span></h1><p>Database anime modern untuk mencari judul Jepang, karakter, seiyuu, musik, manga, light novel, game, jadwal rilis, dan banyak lagi.</p><div class="hero-actions"><button class="primary" onclick="showSeason()">Jelajahi Musim Ini</button><button class="ghost" onclick="showSearch()">Buka Database</button></div></div><div class="stats"><div class="stat"><b id="statA">—</b><span>Anime yang tersedia</span></div><div class="stat"><b id="statC">—</b><span>Karakter & seiyuu</span></div><div class="stat"><b>2026</b><span>Data musim berjalan</span></div><div class="stat"><b>Nature</b><span>Asisten DAS</span></div></div></div><div id="homeContent"><div class="loading">Memuat data terbaru...</div></div>`;
  try{
    const data=await gql(`query{season:Page(perPage:10){media(season:FALL,seasonYear:2026,type:ANIME,sort:POPULARITY_DESC){${mediaFields}}} popular:Page(perPage:10){media(type:ANIME,sort:SCORE_DESC){${mediaFields}}}}`);
    const s=data.season.media,p=data.popular.media;
    document.getElementById('homeContent').innerHTML=section('Anime Terbaru Musim Ini','Fall 2026 · diurutkan berdasarkan popularitas',`<div class="cards">${s.map(card).join('')}</div>`)+section('Anime Populer','Pilihan dengan skor komunitas tinggi',`<div class="cards">${p.map(card).join('')}</div>`)+`<div class="grid2">${section('Akan Rilis Selanjutnya','Jadwal anime yang akan datang',`<div class="list">${s.slice(0,5).map(a=>`<div class="release" onclick="showDetail(${a.id})"><img src="${a.coverImage?.large}"><div><div class="date">${a.startDate?.day||'?'} / ${a.startDate?.month||'?'} / ${a.startDate?.year||'?'}</div><b>${esc(a.title.romaji)}</b><div style="font-size:12px;color:#789">${esc(a.title.native||'')}</div></div></div>`).join('')}</div>`)}${section('DAS Insight','Data yang bisa ditelusuri Nature',`<div class="panel"><b>Nature</b><p style="color:#6d8295;line-height:1.7">Gunakan tombol N di kanan bawah untuk bertanya tentang anime, karakter, musim, atau membuka profil. Untuk AI generatif penuh, sambungkan backend AI pada konfigurasi server.</p></div>`)}</div>`;
  }catch(e){document.getElementById('homeContent').innerHTML=`<div class="empty">Gagal memuat API. Periksa koneksi internet lalu coba lagi.<br><small>${esc(e.message)}</small></div>`}
}
async function showSeason(){app.innerHTML=`<h1>Musim Ini</h1><p style="color:#6d8295">Fall 2026</p><div id="season" class="cards"><div class="loading">Memuat...</div></div>`;try{let d=await gql(`query{Page(perPage:30){media(season:FALL,seasonYear:2026,type:ANIME,sort:POPULARITY_DESC){${mediaFields}}}}`);document.getElementById('season').innerHTML=d.Page.media.map(card).join('')}catch(e){app.innerHTML='<div class="empty">Data musim gagal dimuat.</div>'}}
async function showPopular(){app.innerHTML=`<h1>Anime Populer</h1><p style="color:#6d8295">Anime dengan skor komunitas tinggi</p><div id="pop" class="cards"><div class="loading">Memuat...</div></div>`;try{let d=await gql(`query{Page(perPage:30){media(type:ANIME,sort:POPULARITY_DESC){${mediaFields}}}}`);document.getElementById('pop').innerHTML=d.Page.media.map(card).join('')}catch(e){app.innerHTML='<div class="empty">Data gagal dimuat.</div>'}}
function showSearch(){app.innerHTML=`<h1>Database DAS</h1><p style="color:#6d8295">Cari anime, karakter, manga, atau data terkait.</p><div class="search" style="max-width:650px"><span>⌕</span><input autofocus id="dbSearch" placeholder="Contoh: Frieren, Marin, One Piece..." onkeydown="if(event.key==='Enter')doSearch(this.value)"></div><div id="results" style="margin-top:20px"></div>`}
async function doSearch(q){q=q.trim();if(!q)return;app.innerHTML=`<h1>Hasil pencarian</h1><p style="color:#6d8295">“${esc(q)}”</p><div id="results" class="list"><div class="loading">Mencari...</div></div>`;try{let d=await gql(`query($q:String){anime:Page(perPage:12){media(search:$q,type:ANIME,sort:SEARCH_MATCH){${mediaFields}}} character:Page(perPage:8){characters(search:$q){id name{full native} image{large} description(asHtml:false)}} manga:Page(perPage:8){media(search:$q,type:MANGA,sort:SEARCH_MATCH){${mediaFields}}}}`,{q});let html='';if(d.anime.media.length)html+=`<h2>Anime</h2><div class="cards">${d.anime.media.map(card).join('')}</div>`;if(d.character.characters.length)html+=`<h2 style="margin-top:30px">Karakter</h2><div class="list">${d.character.characters.map(c=>`<div class="result" onclick="showCharacter(${c.id})"><img src="${c.image?.large||''}"><div><div class="kind">CHARACTER</div><b>${esc(c.name.full)}</b><div style="font-size:12px;color:#789">${esc(c.name.native||'')}</div></div></div>`).join('')}</div>`;if(d.manga.media.length)html+=`<h2 style="margin-top:30px">Manga / Light Novel</h2><div class="cards">${d.manga.media.map(card).join('')}</div>`;document.getElementById('results').innerHTML=html||'<div class="empty">Tidak ditemukan.</div>'}catch(e){app.innerHTML=`<div class="empty">Pencarian gagal. ${esc(e.message)}</div>`}}
async function showDetail(id){app.innerHTML='<div class="loading">Memuat detail anime...</div>';try{let d=await gql(`query($id:Int){Media(id:$id,type:ANIME){${mediaFields}}}`,{id});let a=d.Media;let rel=a.relations?.edges||[];let music=rel.filter(x=>x.node.type==='ANIME').slice(0,8);let related=rel.filter(x=>x.node.type==='MANGA').slice(0,12);app.innerHTML=`<div class="detail"><div><img class="detail-poster" src="${a.coverImage?.extraLarge||a.coverImage?.large}"><button class="primary" style="width:100%;margin-top:10px" onclick="saveWatch(${a.id},'${esc(a.title.romaji)}')">♡ Tambah Watchlist</button></div><div><div class="eyebrow">${a.format||'ANIME'} · ${a.status||''}</div><h1>${esc(a.title.romaji||a.title.native)}</h1><div style="color:#789;margin-top:-5px">${esc(a.title.native||'')} · ${esc(a.title.english||'')}</div><div class="chips" style="margin:13px 0">${(a.genres||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div><div class="info-grid"><div class="info"><small>Skor</small><b>★ ${a.averageScore?(a.averageScore/10).toFixed(1):'—'}</b></div><div class="info"><small>Episode</small><b>${a.episodes||'—'}</b></div><div class="info"><small>Musim</small><b>${a.season||'—'} ${a.seasonYear||''}</b></div><div class="info"><small>Studio</small><b>${esc(a.studios?.nodes?.map(s=>s.name).join(', ')||'—')}</b></div><div class="info"><small>Durasi</small><b>${a.duration||'—'} menit</b></div><div class="info"><small>Status</small><b>${a.status||'—'}</b></div></div><p style="line-height:1.8;color:#5f778a">${esc(clean(a.description)||'Belum ada sinopsis.')}</p></div></div><div class="tabs"><button class="active">Ringkasan</button><button>Karakter & Seiyuu</button><button>Musik</button><button>Manga / LN / Game</button></div><section><h2>Karakter & Seiyuu</h2><div class="character-grid">${(a.characters?.edges||[]).map(c=>`<div class="char"><img src="${c.node.image?.large||''}"><div><b>${esc(c.node.name.full)}</b><span>${esc(c.role||'')}</span>${c.voiceActors?.[0]?`<span style="display:block;margin-top:4px">🎙 ${esc(c.voiceActors[0].name.full)}</span>`:''}</div></div>`).join('')}</div></section><div class="grid2"><div class="panel"><h3>🎵 Musik & Relasi Anime</h3><p style="color:#789">Relasi seri anime:</p>${music.length?music.map(x=>`<div class="result" onclick="showDetail(${x.node.id})"><img src="${x.node.coverImage?.large||''}"><div><b>${esc(x.node.title.romaji||x.node.title.native)}</b><div class="kind">${esc(x.relationType)}</div></div></div>`).join(''):'<p style="color:#789">Belum ada data relasi.</p>'}</div><div class="panel"><h3>📚 Manga / Light Novel / Game</h3>${related.length?related.map(x=>`<div class="result"><img src="${x.node.coverImage?.large||''}"><div><b>${esc(x.node.title.romaji||x.node.title.native)}</b><div class="kind">${esc(x.relationType)} · ${x.node.type}</div></div></div>`).join(''):'<p style="color:#789">Belum ada relasi.</p>'}</div></div>`}catch(e){app.innerHTML=`<div class="empty">Detail gagal dimuat: ${esc(e.message)}</div>`}}
async function showCharacter(id){app.innerHTML='<div class="loading">Memuat karakter...</div>';try{let d=await gql(`query($id:Int){Character(id:$id){id name{full native} image{large} description(asHtml:false) gender age dateOfBirth{year month day} bloodType}}`,{id});let c=d.Character;app.innerHTML=`<div class="panel profile"><img class="avatar" style="object-fit:cover" src="${c.image?.large||''}"><h1>${esc(c.name.full)}</h1><p style="color:#789">${esc(c.name.native||'')}</p><div class="info-grid"><div class="info"><small>Gender</small><b>${esc(c.gender||'—')}</b></div><div class="info"><small>Umur</small><b>${esc(c.age||'—')}</b></div><div class="info"><small>Tanggal lahir</small><b>${c.dateOfBirth?.day||'—'}/${c.dateOfBirth?.month||'—'}/${c.dateOfBirth?.year||'—'}</b></div></div><p style="line-height:1.8;color:#61788b">${esc(clean(c.description)||'Belum ada deskripsi.')}</p></div>`}catch(e){app.innerHTML='<div class="empty">Karakter gagal dimuat.</div>'}}
function showProfile(){let p=JSON.parse(localStorage.getItem('dasProfile')||'{}');let watch=JSON.parse(localStorage.getItem('dasWatch')||'[]');app.innerHTML=`<div class="profile"><div class="panel"><div class="avatar">✦</div><h1>Profil DAS</h1><p style="color:#789">Tanggal lahir digunakan untuk menampilkan ucapan ulang tahun di profil kamu.</p><div class="form"><label>Nama pengguna<input id="pName" value="${esc(p.name||'')}"></label><label>Tanggal lahir<input id="pBirth" type="date" value="${p.birth||''}"></label><label>Status favorit<select id="pFav"><option>Anime & Manga</option><option>Anime</option><option>Manga</option><option>Light Novel</option><option>Game</option></select></label><button class="primary" onclick="saveProfile()">Simpan Profil</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Watchlist (${watch.length})</h3>${watch.length?watch.map(w=>`<div class="result" onclick="showDetail(${w.id})"><div><b>${esc(w.title)}</b><div class="kind">WATCHLIST</div></div></div>`).join(''):'<p style="color:#789">Belum ada anime di watchlist.</p>'}</div></div>`}
function saveProfile(){let p={name:document.getElementById('pName').value,birth:document.getElementById('pBirth').value};localStorage.setItem('dasProfile',JSON.stringify(p));let today=new Date(),msg='Profil tersimpan!';if(p.birth){let b=new Date(p.birth+'T00:00:00');if(b.getMonth()===today.getMonth()&&b.getDate()===today.getDate())msg='🎂 Selamat ulang tahun! Semoga harimu menyenangkan!'}alert(msg);showProfile()}
function saveWatch(id,title){let w=JSON.parse(localStorage.getItem('dasWatch')||'[]');if(!w.some(x=>x.id===id)){w.push({id,title});localStorage.setItem('dasWatch',JSON.stringify(w));alert('Ditambahkan ke watchlist!')}else alert('Sudah ada di watchlist.')}
function askNature(){let input=document.getElementById('natureInput'),q=input.value.trim();if(!q)return;let chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg me">${esc(q)}</div>`;input.value='';let l=q.toLowerCase();let ans;if(l.includes('musim')||l.includes('season')){ans='Aku akan membuka daftar anime musim berjalan.';showSeason()}else if(l.includes('populer')){ans='Aku membuka daftar anime populer.';showPopular()}else if(l.includes('profil')){ans='Aku membuka profil DAS.';showProfile()}else if(l.startsWith('cari ')||l.includes('search')){let term=q.replace(/^cari\s*/i,'').replace(/^search\s*/i,'');ans='Aku mencari data untuk “'+term+'”.';doSearch(term)}else{ans='Aku bisa membantu navigasi DAS: cari anime/karakter, buka anime populer, lihat musim ini, atau buka profil. Untuk jawaban AI generatif dan riset otomatis, hubungkan backend model AI ke endpoint Nature.'}chat.innerHTML+=`<div class="msg bot">${esc(ans)}</div>`;chat.scrollTop=chat.scrollHeight}
function birthdayBanner(){let p=JSON.parse(localStorage.getItem('dasProfile')||'{}');if(!p.birth)return;let b=new Date(p.birth+'T00:00:00'),t=new Date();if(b.getMonth()===t.getMonth()&&b.getDate()===t.getDate())setTimeout(()=>alert('🎉 Selamat ulang tahun, '+(p.name||'pengguna DAS')+'!'),700)}
showHome(); birthdayBanner();
</script>
</body>
</html>
